
<!doctype html>
<html lang="pt-BR">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Lista de Tarefas</title>
	<link rel="stylesheet" href="css/style.css" />
</head>
<body>
	<main class="container">
		<h1>Lista de Tarefas</h1>

		<form id="form-tarefa" class="form">
			<input type="text" id="input-tarefa" placeholder="Digite sua tarefa" aria-label="Tarefa" />
			<button type="submit" class="btn">Adicionar</button>
		</form>

			<div id="mensagem-erro" role="status" aria-live="polite" class="erro"></div>

			<section id="progresso" class="progresso">
				<div id="texto-progresso" class="texto-progresso">0 de 0 tarefas concluídas</div>
				<div class="barra-progresso" aria-hidden="false" role="progressbar" aria-valuemin="0" aria-valuemax="100">
					<div id="barra-progresso-fill" class="barra-progresso-fill" style="width: 0%"></div>
				</div>
			</section>

			<ul id="lista-tarefas" class="lista"></ul>
	</main>

	<script src="js/script.js"></script>
</body>
</html>
